# Site settings
title: Stanley Du | Personal Website
author: Stanley Du
tagline: Software Engineer
location: Northwestern University
email: dustanley07@gmail.com
description: >-
  Personal website and blog of Stanley Du.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://dudu-theman.github.io" # base hostname & protocol (used for feed.xml + SEO tags)

# Social links (edit these to match your accounts)
github_username: dudu-theman
linkedin_username: stanleydu2028

# Profile photo shown on the home page
avatar: /assets/images/profile.jpeg

# Only these pages show up in the top nav
header_pages:
  - about.markdown
  - projects.markdown
  - engineering.markdown
  - tidbits.markdown

# Show post excerpts on the home page
show_excerpts: true

# How many posts to show under "Recent posts"
recent_posts_limit: 5

# Projects live in _projects/ as a collection, one file per project.
# Each gets its own page at /projects/<filename>/ and is auto-listed on /projects/.
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Build settings
theme: minima

# Post table of contents stops at h3, so h4 can be used for structure inside a
# subsection without cluttering the contents list.
kramdown:
  toc_levels: 1..3

# Minima 2.5 is written against the old Sass syntax (@import, lighten(), darken()).
# We can't change the theme's own files, so quiet the deprecation notices it emits.
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
plugins:
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
